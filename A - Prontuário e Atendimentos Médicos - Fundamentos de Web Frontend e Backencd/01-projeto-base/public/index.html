<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini-Prontuário</title>

  <!-- Bootstrap 5.3 via CDN: grid, utilitários e componentes base -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous" />

  <!-- Nossa camada: a ordem importa. Tokens -> base -> componentes -->
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>

<body>
  <header class="app-header">
    <div class="container">
      <p class="app-header__eyebrow">IFPI · Programação para Internet II</p>
      <h1 class="app-header__title">Mini-Prontuário</h1>
    </div>
  </header>

  <main class="container app-main">

    <!-- ------------------------------------------------------
         Barra de filtros.
         Nenhum evento é registrado aqui: isso é papel do app.js.
         O HTML descreve a ESTRUTURA, não o comportamento.
    ------------------------------------------------------- -->
    <section id="patients-screen">

      <section class="toolbar" aria-label="Filtros da lista de pacientes">
        <div class="toolbar__search">
          <label class="form-label" for="search-input">Buscar paciente</label>
          <input
            id="search-input"
            class="form-control form-control-lg"
            type="search"
            placeholder="Digite parte do nome…"
            autocomplete="off" />
        </div>

        <div class="toolbar__filter form-check form-switch">
          <input class="form-check-input" type="checkbox" id="only-active-input" />
          <label class="form-check-label" for="only-active-input">
            Mostrar apenas pacientes ativos
          </label>
        </div>    
      </section>

      <p id="result-counter" class="result-counter" aria-live="polite"></p>

       <!-- A lista é desenhada por render.js. Ela nasce vazia de propósito. -->
      <ul id="patient-list" class="patient-list"></ul>
    </section>

    <section id="patient-detail-screen" hidden>

      <button
        id="back-to-patients"
        type="button"
      >
        Voltar para pacientes
      </button>

      <section class="patient-detail">

        <h2 id="patient-detail-name"></h2>
        <p>
          Data de nascimento:
          <span id="patient-detail-birth-date"></span>
        </p>
        <p>
          CNS:
          <span id="patient-detail-national-id"></span>
        </p>

      </section>

      <section class="encounters">

        <h2>Atendimentos</h2>

        <div id="encounter-list"></div>
      </section>

      <section class="new-encounter">

        <h2>Novo atendimento</h2>

        <form id="encounter-form">
          <div>
            <label for="started-at">
              Data e hora
            </label>

            <input
              id="started-at"
              name="startedAt"
              type="datetime-local"
              required
            />
          </div>

          <div>
            <label for="chief-complaint">
              Queixa principal
            </label>

            <input
              id="chief-complaint"
              name="chiefComplaint"
              type="text"
              required
            />
          </div>

          <div>
            <label for="notes">
              Observações
            </label>

            <textarea
              id="notes"
              name="notes"
            ></textarea>
          </div>

          <button type="submit">
            Registrar atendimento
          </button>
          
          <p
            id="encounter-form-error"
            aria-live="polite"
          ></p>

        </form>
      </section>
    </section>

  </main>

  <!-- type="module" habilita import/export no navegador -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
