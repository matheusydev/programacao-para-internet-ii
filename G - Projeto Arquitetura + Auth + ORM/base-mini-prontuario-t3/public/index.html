<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini-Prontuário T3</title>

  <!-- Bootstrap 5.3 via CDN: grid, utilitários e componentes base -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous" />

  <!-- Nossa camada: a ordem importa. Tokens -> base -> componentes -->
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>

<body>
  <header class="app-header">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div>
        <p class="app-header__eyebrow">IFPI · Programação para Internet II · Tópico 3</p>
        <h1 class="app-header__title">Mini-Prontuário</h1>
      </div>
      <!-- Identidade do usuário logado (ou aviso de modo aberto).
           Desenhada por render.js conforme a sessão. -->
      <div id="session-bar" class="session-bar"></div>
    </div>
  </header>

  <!-- ------------------------------------------------------
       TELA DE LOGIN — só aparece quando a trilha AUTH existir
       no backend E não houver sessão. Em "modo aberto"
       (backend de auth ainda não construído) ela fica oculta.
  ------------------------------------------------------- -->
  <section id="login-view" class="container app-main" hidden>
    <div class="login-card" aria-label="Entrar no Mini-Prontuário">
      <h2 class="login-card__title">Entrar</h2>
      <p class="login-card__hint">
        Use as credenciais criadas via <code>POST /api/auth/register</code>.
      </p>

      <label class="form-label" for="email-input">E-mail</label>
      <input id="email-input" class="form-control" type="email" autocomplete="username" />

      <label class="form-label mt-3" for="password-input">Senha</label>
      <input id="password-input" class="form-control" type="password" autocomplete="current-password" />

      <button id="login-button" class="btn btn-success mt-3 w-100" type="button">Entrar</button>
      <p id="login-feedback" class="patient-form__feedback" role="alert"></p>
    </div>
  </section>

  <!-- ------------------------------------------------------
       APLICAÇÃO — visível em modo aberto ou com sessão ativa.
  ------------------------------------------------------- -->
  <main id="app-view" class="container app-main" hidden>

    <!-- Barra de filtros. Nenhum evento é registrado aqui:
         isso é papel do app.js. O HTML descreve a ESTRUTURA. -->
    <section class="toolbar" aria-label="Filtros da lista de pacientes">
      <div class="toolbar__search">
        <label class="form-label" for="search-input">Buscar paciente</label>
        <input
          id="search-input"
          class="form-control form-control-lg"
          type="search"
          placeholder="Digite parte do nome…"
          autocomplete="off" />
      </div>

      <div class="toolbar__filter form-check form-switch">
        <input class="form-check-input" type="checkbox" id="only-active-input" />
        <label class="form-check-label" for="only-active-input">
          Mostrar apenas pacientes ativos
        </label>
      </div>
    </section>

    <!-- Cadastro. Sem <form> de propósito: o navegador não deve
         recarregar a página; o envio é 100% nosso, via fetch. -->
    <section class="patient-form" aria-label="Cadastrar novo paciente">
      <h2 class="patient-form__title">Novo paciente</h2>

      <div class="patient-form__grid">
        <div>
          <label class="form-label" for="name-input">Nome completo</label>
          <input id="name-input" class="form-control" type="text" autocomplete="off" />
        </div>
        <div>
          <label class="form-label" for="birth-date-input">Data de nascimento</label>
          <input id="birth-date-input" class="form-control" type="date" />
        </div>
        <div>
          <label class="form-label" for="national-id-input">CNS</label>
          <input id="national-id-input" class="form-control" type="text" autocomplete="off" />
        </div>
      </div>

      <button id="save-button" class="btn btn-success mt-3" type="button">
        Cadastrar paciente
      </button>

      <p id="form-feedback" class="patient-form__feedback" role="alert"></p>
    </section>

    <!-- Painel de detalhe: foto, atendimentos e prescrições.
         Nasce vazio; render.js o preenche quando um paciente é
         selecionado. -->
    <section id="detail-panel" class="detail-panel" hidden></section>

    <p id="result-counter" class="result-counter" aria-live="polite"></p>

    <!-- A lista é desenhada por render.js. Nasce vazia de propósito. -->
    <ul id="patient-list" class="patient-list"></ul>

  </main>

  <!-- type="module" habilita import/export no navegador -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
